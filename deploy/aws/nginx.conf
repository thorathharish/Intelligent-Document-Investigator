# Public entry point: the built frontend and the API on one origin.
# Only /api reaches the backend; the database and uploaded files are never served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # an upload may carry up to 10 files of 20 MB each (the application enforces both limits)
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a question can take a while when the model retries or falls back
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # the contents of frontend/dist
    root /var/www/document-investigator;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # the app handles its own routes (/i/<id>), so unknown paths get the app page
    location / {
        try_files $uri /index.html;
    }
}
