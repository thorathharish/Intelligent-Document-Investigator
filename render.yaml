# Render blueprint for the FastAPI backend. The service runs from the repository root so that
# demo_docs/ and data/ resolve as they do locally.
services:
  - type: web
    name: document-investigator-api
    runtime: python
    plan: free
    # opencv-python (pulled in by the OCR package) needs system graphics libraries that the Render
    # image does not have; the headless build provides the same module without them.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r backend/requirements.txt &&
      pip uninstall -y opencv-python &&
      pip install --no-deps --force-reinstall opencv-python-headless
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false # set in the Render dashboard; never committed
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: qwen/qwen3.8-27b:free,openrouter/free
      - key: LLM_MODE
        value: live
      - key: LLM_SUPPORTS_JSON_MODE
        value: "false"
      - key: PROMPT_VERSION
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false # the Vercel production origin, e.g. https://your-app.vercel.app
